# ──────────────────────────────────────────────────────────────────────────────
# config/k8s/redis.yaml
#
# Kubernetes resources for the Redis pub/sub adapter.
# Apply with:  kubectl apply -f config/k8s/redis.yaml
#
# NOTE: This is a single-replica, in-memory Redis suitable for the
# WebSocket pub/sub role.  It does NOT persist data.  If you later need
# Redis for caching/sessions with durability, add a PVC and tune the
# command args accordingly.
# ──────────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP   # internal only — Redis must NOT be exposed publicly

---
