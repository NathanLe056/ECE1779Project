# fly.toml app configuration file generated for tournament-web on 2026-04-03T15:27:24-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tournament-web-n'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[env]
  API_UPSTREAM = 'tournament-api-n.fly.dev'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
