app = "tournament-grafana-n"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "grafana_data"
  destination = "/var/lib/grafana"

[env]
  GF_SERVER_ROOT_URL = "https://tournament-grafana-n.fly.dev"
  GF_AUTH_ANONYMOUS_ENABLED = "false"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
